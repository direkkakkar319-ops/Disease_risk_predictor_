services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: disease_predictor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${NEON_DB_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    volumes:
      - upload_data:/app/data/raw_uploads
      - ./ml_models:/app/ml_models
      - ./task_queue:/app/task_queue
      - ./backend/services:/app/services
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${NEON_ASYNC_DB_URL}
      - ASYNC_DATABASE_URL=${NEON_ASYNC_DB_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - PADDLE_USE_GPU=false
    volumes:
      - upload_data:/app/data/raw_uploads
      - ./ml_models:/app/ml_models
      - ./task_queue:/app/task_queue
      - ./backend/services:/app/services
    depends_on:
      - db
      - redis
    command: celery -A task_queue.celery_app worker --loglevel=info --concurrency=2 -Q default,ocr,prediction,comparison

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - redis
    volumes:
      - ./task_queue:/app/task_queue
      - ./ml_models:/app/ml_models
      - ./backend/services:/app/services
    command: celery -A task_queue.celery_app beat --loglevel=info

  flower:
    image: mher/flower:latest
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  upload_data:
