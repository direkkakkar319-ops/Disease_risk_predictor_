name: AI issue summary

on:
  issues:
    types: [opened]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      models: read

    steps:
      - name: Generate issue summary
        id: summary
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a helpful assistant that summarizes GitHub issues for a medical report analysis app (MEDSCAN.AI).
            Write a concise 2-3 sentence summary of the issue, identify the type (bug, feature request, question, etc.),
            and suggest a relevant label if applicable. Be clear and technical.
          prompt: |
            Summarize this GitHub issue:

            Title: ${{ github.event.issue.title }}

            Body:
            ${{ github.event.issue.body }}

      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## AI Issue Summary\n\n${{ steps.summary.outputs.response }}\n\n---\n*Generated by GitHub Models*`
            })
