name: AI issue summary

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to summarize"
        required: true
        type: number
  issues:
    types: [opened]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      models: read

    steps:
      - name: Fetch issue data
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.issue.number || Number('${{ github.event.inputs.issue_number }}');
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            core.setOutput('number', number);
            core.setOutput('title', data.title);
            core.setOutput('body', data.body || '');

      - name: Generate issue summary
        id: summary
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a helpful assistant that summarizes GitHub issues for a medical report analysis app (MEDSCAN.AI).
            Write a concise 2-3 sentence summary of the issue, identify the type (bug, feature request, question, etc.),
            and suggest a relevant label if applicable. Be clear and technical.
          prompt: |
            Summarize this GitHub issue:

            Title: ${{ steps.issue.outputs.title }}

            Body:
            ${{ steps.issue.outputs.body }}

      - name: Post summary comment
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.summary.outputs.response }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.ISSUE_NUMBER),
              body: `## AI Issue Summary\n\n${process.env.SUMMARY}\n\n---\n*Generated by GitHub Models*`
            })
